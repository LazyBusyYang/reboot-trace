name: Frontend image manual (dev / sha-*)

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: 'Git ref to build; whitespace is trimmed and an empty value uses the workflow revision'
        required: false
        default: ''
      image_tag:
        description: 'Docker Hub image tag: dev or sha-* (for example sha-abc1234)'
        required: true
        default: dev

env:
  IMAGE_NAME: dockersenseyang/reboot-trace

jobs:
  push:
    name: Build and push frontend image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Resolve checkout ref
        id: resolve_ref
        env:
          GIT_REF_INPUT: ${{ inputs.git_ref }}
        run: |
          set -euo pipefail
          trimmed="${GIT_REF_INPUT#"${GIT_REF_INPUT%%[![:space:]]*}"}"
          trimmed="${trimmed%"${trimmed##*[![:space:]]}"}"
          if [[ -z "${trimmed}" ]]; then
            resolved="${GITHUB_SHA}"
          else
            resolved="${trimmed}"
          fi
          {
            echo 'ref<<__REF__'
            printf '%s\n' "${resolved}"
            echo '__REF__'
          } >> "${GITHUB_OUTPUT}"
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.resolve_ref.outputs.ref }}
      - name: Show resolved revision
        run: |
          set -euo pipefail
          echo "Checkout ref: ${{ steps.resolve_ref.outputs.ref }}"
          echo "Resolved HEAD: $(git rev-parse HEAD)"
          git log -1 --oneline
      - name: Validate image tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: bash scripts/validate_image_tag.sh "${IMAGE_TAG}"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}
          build-args: |
            IMAGE_VERSION=${{ inputs.image_tag }}
          provenance: false
