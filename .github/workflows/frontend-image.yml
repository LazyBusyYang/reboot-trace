name: Frontend image CI and release

on:
  push:
    branches:
      - main
      - 'release/**'
    tags:
      - 'v*'
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: dockersenseyang/reboot-trace

jobs:
  check-version:
    name: Check VERSION
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Validate VERSION and tag alignment
        run: bash scripts/check_version.sh

  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Decide Docker Hub publish
        id: gate
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: bash scripts/ci_release_gate.sh

  frontend-checks:
    name: Frontend tests and build
    needs: [check-version]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Validate frontend image
    needs: [check-version, frontend-checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build without pushing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: reboot-trace-frontend:ci
          build-args: |
            IMAGE_VERSION=ci
      - name: Validate Nginx configuration
        run: docker run --rm reboot-trace-frontend:ci nginx -t

  docker-publish:
    name: Publish SemVer image to Docker Hub
    needs: [check-version, release-gate, frontend-checks, docker-build]
    if: >
      github.event_name == 'push' &&
      needs.release-gate.outputs.publish == 'true' &&
      needs.check-version.result == 'success' &&
      needs.frontend-checks.result == 'success' &&
      needs.docker-build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Resolve version and check existing image
        id: meta
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          version="$(bash scripts/check_version.sh)"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          if docker buildx imagetools inspect "${IMAGE_NAME}:${version}" >/dev/null 2>&1; then
            echo "Image ${IMAGE_NAME}:${version} already exists; skipping build."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
          else
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Build and push
        if: steps.meta.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          build-args: |
            IMAGE_VERSION=${{ steps.meta.outputs.version }}
          provenance: false
