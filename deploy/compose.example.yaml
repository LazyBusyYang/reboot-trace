# The collector must run as a native process inside each target container.
# Compose cannot attach this image to a sibling Kubernetes container's PID and
# writable-layer lifecycle. This file therefore deploys only the shared UI.
services:
  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    read_only: true
    tmpfs: [/tmp]
    ports: ["8088:8080"]
    volumes:
      - ./runtime-config.example.json:/usr/share/nginx/html/config/runtime-config.json:ro
